<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple Album - a gallery of beautiful temples around the world.">
    <meta name="author" content="Manuela Alejandra Rodríguez Cárdenas">
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Adamina&family=Noto+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menu" aria-label="Menu">&#9776;</button>
        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>
    <main>
        <h2>Home</h2>
        <div class="temple-grid">
            <figure>
                <img src="images/bogota-temple.jpg" alt="Bogotá Colombia Temple" loading="lazy">
                <figcaption>Bogotá Colombia</figcaption>
            </figure>
            <figure>
                <img src="images/argentinatemples.jpg" alt="Córdoba Argentina Temple" loading="lazy">
                <figcaption>Córdoba Argentina</figcaption>
            </figure>
            <figure>
                <img src="images/freiberg-germanytemple.jpg" alt="Freiberg Germany Temple" loading="lazy">
                <figcaption>Freiberg Germany</figcaption>
            </figure>
            <figure>
                <img src="images/chicagotemple.jpg" alt="Chicago Illinois Temple" loading="lazy">
                <figcaption>Chicago Illinois</figcaption>
            </figure>
            <figure>
                <img src="images/mexicotemple.jpg" alt="Colonia Juárez Chihuahua Mexico Temple" loading="lazy">
                <figcaption>Colonia Juárez Chihuahua Mexico</figcaption>
            </figure>
            <figure>
                <img src="images/guayaquil-ecuador-temple.jpg" alt="Guayaquil Ecuador Temple" loading="lazy">
                <figcaption>Guayaquil Ecuador</figcaption>
            </figure>
            <figure>
                <img src="images/denvertemple.jpg" alt="Denver Colorado Temple" loading="lazy">
                <figcaption>Denver Colorado</figcaption>
            </figure>
            <figure>
                <img src="images/chiletemple.jpg" alt="Concepción Chile Temple" loading="lazy">
                <figcaption>Concepción Chile</figcaption>
            </figure>
            <figure>
                <img src="images/columbia-river-temple.jpg" alt="Columbia River Washington Temple" loading="lazy">
                <figcaption>Columbia River Washington</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> 🐥 Manuela Alejandra Rodríguez Cárdenas 🐥 Colombia</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
