<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A guide for beginner crocheters with simple tips, basic stitches, and helpful advice to make learning crochet fun and easy.">
    <meta name="author" content="Manuela Alejandra Rodríguez Cárdenas">
    <title>Crochet by Manu - WDD 131</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/tips.css">
    <link rel="stylesheet" href="styles/tips-large.css">
    <script src="scripts/tips.js" defer></script>
</head>
<body>
    <header>
        <h1>Crochet by Manu</h1>
        <button id="menu" aria-label="Menu">&#9776;</button>
        <nav>
            <a id="home" href="index.html">Home</a>
            <a id="gallery" href="gallery.html">Gallery</a>
            <a id="tips" href="tips.html">Tips</a>
        </nav>
    </header>
    <main>
        <h2 id="page-title">Tips</h2>
        <div id="tips-cards" class="tips-grid">
            
        </div>
        <section id="contact">
            <h2>Have questions or comments about the tips?</h2>
            <p>Write to me and tell me what you would like to learn about crochet.</p>

            <form id="form-tips" action="#" method="POST">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="topic">Topic of your question:</label><br>
                <select id="topic" name="topic">
                    <option value="" disabled selected>Select the topic</option>
                    <option value="stitches">Crochet stitches</option>
                    <option value="tools">Tools</option>
                    <option value="tips">General tips</option>
                </select><br><br>

                <label>Experience level:</label><br>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="beginner" name="level" value="beginner">
                        <label for="beginner">Beginner</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="intermediate" name="level" value="intermediate">
                        <label for="intermediate">Intermediate</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="advanced" name="level" value="advanced">
                        <label for="advanced">Advanced</label>
                    </div>
                </div>

                <label for="message">Your message:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe" class="square-checkbox">
                    <label for="subscribe">I want to receive tips and updates by email</label>
                </div>

                <button type="submit">Send a Stitch</button>
            </form>

            <p id="response"></p>
        </section>

    </main>
    <footer>
        <p>&copy; <span id="year"></span> 🍥 Manuela Alejandra Rodríguez Cárdenas 🍥 Colombia</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
